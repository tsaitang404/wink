name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      # 1. 单 HTML 发送端
      - run: npx vite build --config sender-web/vite.config.ts
      # 2. Linux 静态二进制
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
        working-directory: sender-cli

      - name: Assemble release artifacts (2 files)
        run: |
          mkdir -p dist/release
          cp sender-cli/target/x86_64-unknown-linux-musl/release/wink dist/release/wink-linux-x86_64
          cp sender-web/dist/index.html dist/release/wink-sender.html
          cd dist/release
          sha256sum * > SHA256SUMS.txt
          echo "=== release artifacts ==="
          ls -la
          file wink-linux-x86_64 | grep -o 'statically linked\|static-pie'

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          draft: true
