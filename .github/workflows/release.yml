name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: wink-linux-x86_64
          - target: aarch64-unknown-linux-musl
            artifact: wink-linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build with cross (musl toolchain in Docker)
        run: cross build --release --target ${{ matrix.target }}
        working-directory: sender-cli
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: sender-cli/target/${{ matrix.target }}/release/wink
          if-no-files-found: error

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx vite build --config sender-web/vite.config.ts
      - run: npx vite build --config receiver/vite.config.ts
      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wink-web
          path: |
            sender-web/dist/index.html
            receiver/dist/index.html
          if-no-files-found: error

  release:
    needs: [build-binaries, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
      - name: Assemble final artifacts
        run: |
          cd dist/bin
          # 二进制
          mv wink-linux-x86_64/wink ./wink-x86.bin
          mv wink-linux-aarch64/wink ./wink-arm.bin
          rm -rf wink-linux-x86_64 wink-linux-aarch64
          mv ./wink-x86.bin ./wink-linux-x86_64
          mv ./wink-arm.bin ./wink-linux-aarch64
          chmod +x wink-linux-*
          # Web 单 HTML
          mv wink-web/sender-web/index.html ./wink-sender.html
          mv wink-web/receiver/index.html ./wink-receiver.html
          rm -rf wink-web
          echo "=== release artifacts ==="
          ls -la
          file wink-linux-* | grep -o 'statically linked\|static-pie'
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/bin/*
          draft: true
