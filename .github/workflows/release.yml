name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: wink-linux-x86_64
          - target: aarch64-unknown-linux-musl
            artifact: wink-linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Build with cross (musl toolchain in Docker)
        uses: cross-rs/cross-action@main
        with:
          working-directory: sender-cli
          target: ${{ matrix.target }}
          args: --release
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: sender-cli/target/${{ matrix.target }}/release/wink
          if-no-files-found: error

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx vite build --config sender-web/vite.config.ts
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: wink-sender-html
          path: sender-web/dist/index.html
          if-no-files-found: error

  release:
    needs: [build-binaries, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
      - name: Assemble final artifacts
        run: |
          cd dist/bin
          # 下载结构: dist/bin/<artifact-name>/wink
          # 先移走二进制到临时名，再删目录，最后重命名
          mv wink-linux-x86_64/wink ./wink-x86.bin
          mv wink-linux-aarch64/wink ./wink-arm.bin
          mv wink-sender-html/index.html ./wink-web.html
          rm -rf wink-linux-x86_64 wink-linux-aarch64 wink-sender-html
          mv ./wink-x86.bin ./wink-linux-x86_64
          mv ./wink-arm.bin ./wink-linux-aarch64
          mv ./wink-web.html ./wink-sender.html
          chmod +x wink-linux-*
          echo "=== release artifacts ==="
          ls -la
          file wink-linux-* | grep -o 'statically linked\|static-pie'
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/bin/*
          draft: true
