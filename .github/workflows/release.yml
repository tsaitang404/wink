name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: wink-linux-x86_64
          - target: aarch64-unknown-linux-musl
            artifact: wink-linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - run: cargo build --release --target ${{ matrix.target }}
        working-directory: sender-cli
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: sender-cli/target/${{ matrix.target }}/release/wink
          if-no-files-found: error

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx vite build --config sender-web/vite.config.ts
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: wink-sender-html
          path: sender-web/dist/index.html
          if-no-files-found: error

  release:
    needs: [build-binaries, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
      - name: Assemble final artifacts
        run: |
          cd dist/bin
          mv wink-linux-x86_64/wink wink-linux-x86_64
          mv wink-linux-aarch64/wink wink-linux-aarch64
          mv wink-sender-html/index.html wink-sender.html
          chmod +x wink-linux-*
          echo "=== release artifacts ==="
          ls -la
          file wink-linux-* | grep -o 'statically linked\|static-pie'
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/bin/*
          draft: true
