name: CI

on:
  push:
    branches: [main, 'release/*']
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm test
      - run: npx tsc --noEmit

  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - run: cargo fmt --check
        working-directory: sender-cli
      - run: cargo clippy -- -D warnings
        working-directory: sender-cli
      - run: cargo test
        working-directory: sender-cli
      - run: cargo build --release --target ${{ matrix.target }}
        working-directory: sender-cli

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx vite build --config sender-web/vite.config.ts
        working-directory: .
      - run: test -f sender-web/dist/index.html && echo "sender HTML built OK"
