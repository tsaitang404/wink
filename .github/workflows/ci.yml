name: CI

on:
  push:
    branches: [main, 'release/*']
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm test
      - run: npx tsc --noEmit

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl
      - name: Install liblzma dev (xz2 dependency)
        run: sudo apt-get update && sudo apt-get install -y liblzma-dev
      - run: cargo fmt --check
        working-directory: sender-cli
      - run: cargo clippy -- -D warnings
        working-directory: sender-cli
      - run: cargo test
        working-directory: sender-cli

  rust-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - name: Build with cross (musl toolchain in Docker)
        uses: cross-rs/cross-action@main
        with:
          working-directory: sender-cli
          target: ${{ matrix.target }}
          args: --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: sender-cli/target/${{ matrix.target }}/release/wink
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx vite build --config sender-web/vite.config.ts
        working-directory: .
      - run: test -f sender-web/dist/index.html && echo "sender HTML built OK"
